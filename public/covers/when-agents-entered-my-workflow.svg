  <g fill="#ffd98b"><circle cx="376" cy="500" r="8"/><circle cx="565" cy="435" r="8"/><circle cx="1034" cy="462" r="8"/><circle cx="1190" cy="444" r="8"/></g>

  <text x="86" y="105" fill="#f5f0ff" font-family="Georgia, 'Noto Serif SC', serif" font-size="58" letter-spacing="1">实习之后，我不再只问哪个 Agent 最强</text>
  <text x="90" y="151" fill="#a8c7ed" font-family="ui-monospace, Consolas, monospace" font-size="20" letter-spacing="3">AN INTERNSHIP FIELD NOTE ON AI AGENT HARNESSES</text>
  <text x="800" y="770" text-anchor="middle" fill="#a8c7ed" font-family="ui-monospace, Consolas, monospace" font-size="19" letter-spacing="3">CONTEXT · TOOLS · OBSERVABILITY · CONTROL</text>
</svg>
