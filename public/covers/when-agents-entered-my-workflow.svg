<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 854" role="img" aria-labelledby="title desc">
  <title id="title">实习之后，我不再只问哪个 Agent 最强</title>
  <desc id="desc">一群原创的 AI 小助手在终端竞技场中围绕工作流协作：有人读代码、有人拿工具、有人记录知识，表现不同 Agent harness 的使用体验。</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111a31"/>
      <stop offset="0.58" stop-color="#23365c"/>
      <stop offset="1" stop-color="#50345d"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="43%" r="58%">
      <stop offset="0" stop-color="#b8d9ff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#b8d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#22314c"/>
      <stop offset="1" stop-color="#101522"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#050916" flood-opacity=".52"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <rect width="1600" height="854" fill="url(#sky)"/>
  <rect width="1600" height="854" fill="url(#halo)"/>
  <g fill="#dce8ff" opacity=".55">
    <circle cx="92" cy="112" r="2"/><circle cx="186" cy="228" r="3"/><circle cx="321" cy="92" r="2"/><circle cx="515" cy="169" r="2"/><circle cx="734" cy="88" r="3"/><circle cx="920" cy="159" r="2"/><circle cx="1145" cy="82" r="3"/><circle cx="1396" cy="167" r="2"/><circle cx="1494" cy="278" r="3"/>
  </g>
  <g opacity=".18" stroke="#b9d7ff" stroke-width="2">
    <path d="M105 330H370L470 251H713L822 330H1060L1178 235H1465" fill="none"/>
    <path d="M250 390L418 322M610 322L745 390M1005 390L1178 322"/>
    <circle cx="370" cy="330" r="7" fill="#b9d7ff"/><circle cx="822" cy="330" r="7" fill="#b9d7ff"/><circle cx="1178" cy="235" r="7" fill="#b9d7ff"/>
  </g>

  <ellipse cx="800" cy="655" rx="695" ry="108" fill="#070c1d" opacity=".42" filter="url(#soft)"/>
  <path d="M0 622C286 582 548 648 802 615c255-33 510-48 798 16v223H0z" fill="url(#desk)"/>
  <path d="M0 634c309-45 559 32 802-1 286-37 541-36 798 5" fill="none" stroke="#9bc7ee" stroke-opacity=".18" stroke-width="5"/>

  <!-- center terminal -->
  <g filter="url(#shadow)">
    <rect x="566" y="248" width="468" height="320" rx="22" fill="#111a2b" stroke="#91c7ff" stroke-width="3"/>
    <rect x="588" y="276" width="424" height="252" rx="12" fill="#0a1020"/>
    <circle cx="618" cy="302" r="7" fill="#ff8fa3"/><circle cx="643" cy="302" r="7" fill="#ffd37c"/><circle cx="668" cy="302" r="7" fill="#83e6be"/>
    <text x="621" y="356" fill="#89ecbd" font-family="ui-monospace, Consolas, monospace" font-size="25">$ choose_harness --task</text>
    <text x="621" y="397" fill="#c6d7ef" font-family="ui-monospace, Consolas, monospace" font-size="21">context  ✓   tools  ✓</text>
    <text x="621" y="432" fill="#c6d7ef" font-family="ui-monospace, Consolas, monospace" font-size="21">observe  ✓   steer  ✓</text>
    <text x="621" y="480" fill="#f6cb88" font-family="ui-monospace, Consolas, monospace" font-size="21">not strongest — just right</text>
  </g>

  <!-- mascot 1: code -->
  <g transform="translate(222 408)" filter="url(#shadow)">
    <path d="M94 38c-31-35-78-22-87 17-8 35 12 79 53 86 44 8 87-24 78-66-3-16-17-30-44-37z" fill="#78b7ff"/>
