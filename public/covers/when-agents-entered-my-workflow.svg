    <rect x="19" y="201" width="116" height="38" rx="19" fill="#e3ffea"/>
    <text x="77" y="227" text-anchor="middle" fill="#26614c" font-family="ui-monospace, monospace" font-size="20" font-weight="700">PI</text>
