  <g transform="translate(1031 516)" filter="url(#shadow)">
    <path d="M42 24c41-29 93 2 88 49-5 48-60 71-94 38C1 79 9 47 42 24z" fill="#d5a7f1"/>
    <path d="M26 68c14-42 76-48 105-8" fill="none" stroke="#f8eaff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="56" cy="78" r="6" fill="#3d2755"/><circle cx="99" cy="78" r="6" fill="#3d2755"/>
    <path d="M60 103q18 13 36 0" fill="none" stroke="#3d2755" stroke-width="5" stroke-linecap="round"/>
    <path d="M38 133l-25 44M114 133l29 44" stroke="#f8eaff" stroke-width="9" stroke-linecap="round"/>
    <rect x="17" y="186" width="122" height="38" rx="19" fill="#f8eaff"/>
    <text x="78" y="212" text-anchor="middle" fill="#694983" font-family="ui-monospace, monospace" font-size="17" font-weight="700">TOOLS</text>
