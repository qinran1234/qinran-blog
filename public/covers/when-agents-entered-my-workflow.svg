  <g transform="translate(1192 406)" filter="url(#shadow)">
    <path d="M39 27c42-27 91 3 84 49-6 41-56 66-91 36-35-31-24-66 7-85z" fill="#9be0b0"/>
    <path d="M23 70c18-42 79-45 105-4" fill="none" stroke="#e3ffea" stroke-width="6" stroke-linecap="round"/>
